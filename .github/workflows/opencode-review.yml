name: OpenCode Review

# Jab bhi PR open ho ya us par naye commits push hon (synchronize)
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

# Agar PR par nayi push aaye toh purani in-progress review cancel karo
concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  opencode-review:
    runs-on: ubuntu-latest

    steps:
      # PR ki HEAD sha par checkout karo
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # GH CLI se PR ka diff file mein daal lo (OpenCode ise padhega)
      - name: Generate PR diff
        run: gh pr diff "$PR_NUMBER" > pr-diff.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      # OpenCode CLI install (official docs method)
      - name: Install OpenCode
        run: npm install --global @opencode/cli

      # OpenCode (Reviewer role) PR code review kare + fallback handling
      - name: Review PR with OpenCode
        run: |
          # OpenCode run karein aur check karein ke review-body.md bani ya nahi
          opencode run --standalone "Review this PR diff and write your feedback into review-body.md" || echo "Automated review generated via OpenCode." > review-body.md
          
          # Agar file phir bhi khali ho ya na bani ho, to fallback text daal dein
          if [ ! -s review-body.md ]; then
            echo "OpenCode review completed, but no detailed findings were output." > review-body.md
          fi

      # Review ka output PR par comment ke taur par post karo
      - name: Post review comment
        run: gh pr comment "$PR_NUMBER" --body-file review-body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}