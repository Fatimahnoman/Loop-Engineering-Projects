name: OpenCode Review

# Jab bhi PR open ho ya us par naye commits push hon (synchronize)
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

# Agar PR par nayi push aaye toh purani in-progress review cancel karo
concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  opencode-review:
    runs-on: ubuntu-latest

    steps:
      # PR ki HEAD sha par checkout karo
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # GH CLI se PR ka diff file mein daal lo (OpenCode ise padhega)
      - name: Generate PR diff
        run: gh pr diff "$PR_NUMBER" > pr-diff.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      # OpenCode CLI install (official docs method)
      - name: Install OpenCode
        run: npm install --global @opencode/cli

      # OpenCode (Reviewer role) PR code review kare
      # --standalone: CI mein private server, taake API key env se mile
      # --file pr-diff.txt: diff ko message ke saath attach karta hai
      # continue-on-error: review fail ho to bhi comment post ho sake
      - name: Review PR with OpenCode
        id: review
        continue-on-error: true
        run: |
          opencode run --standalone --model "$MODEL" \
            --file pr-diff.txt \
            "You are the Reviewer (Checker) in a code review workflow. \
            Review the attached pull request diff for correctness, bugs, security issues, and style problems. \
            Reply with a concise, actionable checklist of findings using file:line references and concrete suggestions. \
            If the code looks good, clearly state that no blocking issues were found. \
            Do NOT modify any files." > review-body.md
        env:
          # Default model; override karna ho to repo/org variable OPENCODE_MODEL set karo
          MODEL: ${{ vars.OPENCODE_MODEL || 'anthropic/claude-sonnet-4-5' }}
          # Provider API key — repo secret mein dalna hoga.
          # (Dusre provider use karo to ANTHROPIC_API_KEY ko apne provider ke secret se badlo)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Review ka output PR par comment ke taur par post karo
      - name: Post review comment
        run: gh pr comment "$PR_NUMBER" --body-file review-body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}